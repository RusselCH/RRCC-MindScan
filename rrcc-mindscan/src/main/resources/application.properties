spring.application.name=rrcc-mindscan
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.datasource.url=jdbc:sqlite:${user.home}/RRCCMindScan/rrcc_mindscan.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.com.ejemplo.rrccmindscan=INFO
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

rrcc.seeder.habilitado=true

rrcc.analisis.rrcc-palabras-por-minuto=200
rrcc.analisis.rrcc-palabras-oracion-larga=40
rrcc.analisis.rrcc-proporcion-resumen=0.25
rrcc.analisis.rrcc-max-oraciones-grafo=400
rrcc.analisis.rrcc-umbral-similitud-contradiccion=0.45
rrcc.analisis.rrcc-tamano-maximo-mb=50
